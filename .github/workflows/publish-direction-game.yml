name: Publish direction game

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Edge TTS audio
        run: |
          python -m pip install --disable-pip-version-check edge-tts
          python games/direction-counting/generate_audio.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir -p _site/audio
          cp games/direction-counting/index.html _site/index.html
          cp games/direction-counting/audio/*.mp3 _site/audio/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
