name: Publish shape-counting adventure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "games/shape-counting-adventure/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate audio for the existing direction game
        run: |
          python -m pip install --disable-pip-version-check edge-tts==7.2.8
          python games/direction-counting/generate_audio.py
      - name: Build the site and add the math game
        run: |
          node games/direction-counting/build.mjs
          mkdir -p _site/shape-counting-adventure
          cp games/shape-counting-adventure/index.html _site/shape-counting-adventure/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

