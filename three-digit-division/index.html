<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8ff">
  <meta name="description" content="三年級數學互動教學：一步一步看懂三位數除以一位數的直式除法。">
  <title>三位數除法練習室</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #16314b;
      --muted: #5d7185;
      --blue: #2364dc;
      --blue-dark: #174cb2;
      --blue-soft: #eaf2ff;
      --mint: #ddf7ee;
      --mint-dark: #087d60;
      --yellow: #fff2bf;
      --coral: #ff795f;
      --paper: #ffffff;
      --line: #dce6f1;
      --shadow: 0 18px 50px rgba(26, 67, 118, .10);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 92% 5%, rgba(255, 226, 135, .40), transparent 18rem),
        radial-gradient(circle at 2% 25%, rgba(196, 231, 255, .55), transparent 21rem),
        #f4f8ff;
      font-size: 17px;
      line-height: 1.65;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .page { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 23px 0 12px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: .02em; }
    .brand-mark {
      display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px;
      color: #fff; background: var(--blue); box-shadow: 0 7px 16px rgba(35,100,220,.24); font-size: 22px;
    }
    .grade-pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border: 1px solid #d5e3f7; border-radius: 999px; color: #315b91; background: rgba(255,255,255,.76); font-weight: 700; font-size: 14px; }
    .hero { display: grid; grid-template-columns: 1.2fr .8fr; gap: 26px; align-items: center; padding: 37px 0 30px; }
    .eyebrow { margin: 0 0 10px; color: var(--blue); font-size: 14px; font-weight: 900; letter-spacing: .1em; }
    h1 { max-width: 650px; margin: 0; font-size: clamp(36px, 5vw, 60px); line-height: 1.12; letter-spacing: -.045em; }
    .hero-copy { max-width: 620px; margin: 16px 0 0; color: var(--muted); font-size: 19px; }
    .hero-note { display: inline-flex; align-items: center; gap: 9px; margin-top: 19px; padding: 9px 13px; border-radius: 13px; color: #695217; background: var(--yellow); font-size: 15px; font-weight: 800; }
    .hero-art { min-height: 210px; display: grid; place-items: center; position: relative; }
    .hero-art::before { content: ""; position: absolute; width: 208px; height: 208px; border-radius: 50%; background: #e5efff; }
    .hero-art-card { position: relative; transform: rotate(3deg); width: 226px; padding: 17px 20px 14px; border: 2px solid #d6e3f3; border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); }
    .hero-art-card strong { display: block; color: var(--blue); font-size: 14px; }
    .hero-math { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; font-size: 34px; font-weight: 900; letter-spacing: .06em; }
    .hero-math span:last-child { color: var(--mint-dark); }
    .spark { position: absolute; z-index: 1; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; color: #734e00; background: #ffe48a; font-size: 22px; font-weight: 900; }
    .spark.one { top: 17px; right: 12%; transform: rotate(10deg); }
    .spark.two { bottom: 18px; left: 13%; color: #fff; background: var(--coral); transform: rotate(-10deg); }
    .lesson-card { overflow: hidden; border: 1px solid #dce8f7; border-radius: 26px; background: rgba(255,255,255,.94); box-shadow: var(--shadow); }
    .lesson-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; padding: 25px 28px 20px; border-bottom: 1px solid #e8eef5; }
    .lesson-head h2 { margin: 0; font-size: 25px; line-height: 1.3; }
    .lesson-head p { margin: 7px 0 0; color: var(--muted); }
    .step-tag { flex: none; padding: 7px 12px; border: 1px solid #d6e5ff; border-radius: 999px; color: var(--blue-dark); background: var(--blue-soft); font-weight: 800; font-size: 14px; }
    .problem-form { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; padding: 18px 28px; background: #f8fbff; }
    .field { display: grid; gap: 5px; }
    .field label { color: #496177; font-size: 14px; font-weight: 800; }
    .field input { width: 114px; min-height: 48px; padding: 9px 12px; border: 2px solid #cbd9ea; border-radius: 12px; outline: none; color: var(--ink); background: #fff; font-size: 22px; font-weight: 850; text-align: center; }
    .field input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(35,100,220,.13); }
    .divide-sign { align-self: center; padding-top: 20px; color: #6b8095; font-size: 24px; font-weight: 900; }
    .primary-button, .secondary-button, .step-button, .auto-button, .example-button {
      min-height: 48px; border: 0; border-radius: 12px; font-weight: 850; transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #ffbd52; outline-offset: 3px; }
    .primary-button { padding: 0 19px; color: #fff; background: var(--blue); box-shadow: 0 8px 15px rgba(35,100,220,.18); }
    .primary-button:hover { background: var(--blue-dark); }
    .form-error { flex-basis: 100%; min-height: 0; margin: 0; color: #a53925; font-size: 14px; font-weight: 700; }
    .examples { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 28px 18px; background: #f8fbff; }
    .examples-label { margin-right: 3px; color: #61758a; font-size: 14px; font-weight: 800; }
    .example-button { min-height: 38px; padding: 5px 12px; border: 1px solid #d3e1f1; color: #385a79; background: #fff; font-size: 15px; }
    .example-button:hover { border-color: #9dbbea; background: #eff5ff; }
    .work-area { display: grid; grid-template-columns: .92fr 1.08fr; gap: 18px; padding: 22px 28px 24px; }
    .board-card, .step-card { min-width: 0; border: 1px solid #e3ebf5; border-radius: 20px; }
    .board-card { padding: 20px; background: #fcfdff; }
    .card-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; color: #506a82; font-size: 14px; font-weight: 850; }
    .small-sticker { padding: 5px 9px; border-radius: 9px; color: #7a5b06; background: #fff2bf; font-size: 13px; }
    .division-paper { max-width: 320px; margin: 0 auto; padding: 15px 10px 13px; border: 1px dashed #cddbea; border-radius: 16px; background: #fff; }
    .quotient-caption { margin-left: 65px; color: #8293a4; font-size: 13px; font-weight: 750; }
    .quotient-row { display: grid; grid-template-columns: repeat(3, 1fr); width: 112px; margin-left: 65px; text-align: center; font-size: 28px; font-weight: 900; line-height: 1.12; }
    .quotient-slot { min-height: 34px; color: #b6c3cf; }
    .quotient-slot.filled { color: var(--blue); }
    .quotient-slot.active { color: #fff; border-radius: 9px; background: var(--blue); }
    .division-row { display: grid; grid-template-columns: 52px 13px 112px; align-items: end; }
    .divisor { padding-right: 6px; color: var(--coral); text-align: right; font-size: 27px; font-weight: 900; }
    .bracket { height: 34px; border-top: 3px solid var(--ink); border-left: 3px solid var(--ink); border-radius: 10px 0 0 0; }
    .dividend { display: grid; grid-template-columns: repeat(3, 1fr); min-height: 37px; border-top: 3px solid var(--ink); text-align: center; font-size: 27px; font-weight: 900; line-height: 1.1; }
    .dividend-digit { border-radius: 7px; }
    .dividend-digit.active { color: var(--blue-dark); background: #eaf2ff; }
    .work-stack { display: grid; grid-template-columns: 18px repeat(3, minmax(0, 1fr)); width: 130px; margin-left: 47px; padding-top: 8px; font-size: 23px; font-weight: 800; line-height: 1.25; }
    .work-grid-row { display: grid; grid-column: 1 / -1; grid-template-columns: 18px repeat(3, minmax(0, 1fr)); min-height: 30px; align-items: center; }
    .work-digit { text-align: center; }
    .work-operation { color: var(--coral); text-align: center; }
    .work-rule { height: 2px; margin: 1px 0 3px; background: #9baebf; }
    .work-remainder .work-digit, .work-new-number .work-digit, .work-drop-arrow .work-digit { color: var(--mint-dark); }
    .work-drop-arrow { min-height: 18px; align-items: end; font-size: 18px; line-height: 1; }
    .board-caption { margin: 12px 0 0; color: #60768a; text-align: center; font-size: 14px; }
    .equation-chip { margin: 16px 0 0; padding: 11px; border-radius: 13px; color: #174cb2; background: #edf4ff; text-align: center; font-size: clamp(20px, 3vw, 25px); font-weight: 900; letter-spacing: .02em; }
    .step-card { display: flex; flex-direction: column; padding: 21px; background: #fff; }
    .step-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .step-icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; color: #fff; background: var(--mint-dark); font-size: 20px; font-weight: 900; }
    .step-kind { color: var(--mint-dark); font-size: 14px; font-weight: 900; }
    .step-card h3 { margin: 0; font-size: 24px; line-height: 1.35; }
    .step-copy { margin: 12px 0 0; color: #4d6378; font-size: 18px; }
    .kid-tip { margin-top: auto; padding: 12px 13px; border-radius: 13px; color: #675316; background: #fff5ce; font-size: 15px; font-weight: 750; }
    .kid-tip strong { color: #493600; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 0 28px 23px; }
    .step-button { padding: 0 17px; border: 1px solid #d5e2ef; color: #31516e; background: #fff; }
    .step-button:hover:not(:disabled) { border-color: #9dbbea; background: #f2f7ff; }
    .step-button:disabled { cursor: not-allowed; opacity: .45; transform: none; }
    .auto-button { padding: 0 18px; color: #fff; background: var(--mint-dark); box-shadow: 0 8px 15px rgba(8,125,96,.15); }
    .auto-button:hover { background: #06694f; }
    .timer-box { display: flex; flex: 1 1 230px; align-items: center; gap: 11px; min-height: 48px; padding: 7px 12px; border: 1px solid #e0e9f2; border-radius: 12px; background: #fbfdff; }
    .timer-copy { flex: 1; color: #60758a; font-size: 14px; font-weight: 750; }
    .timer-number { min-width: 55px; color: var(--blue); text-align: right; font-weight: 900; }
    .timer-track { overflow: hidden; width: 72px; height: 7px; border-radius: 99px; background: #e4ecf4; }
    .timer-bar { width: 0; height: 100%; border-radius: inherit; background: var(--blue); transition: width .1s linear; }
    .result-card { display: none; margin: 0 28px 25px; padding: 15px 18px; border: 1px solid #b9e9d8; border-radius: 15px; color: #145f4b; background: #effcf7; }
    .result-card.show { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; }
    .result-card strong { font-size: 21px; }
    .result-check { color: #3e7364; font-size: 15px; }
    .learning-section { display: grid; grid-template-columns: .78fr 1.22fr; gap: 24px; align-items: start; padding: 47px 0 36px; }
    .section-intro h2 { margin: 0; font-size: 30px; line-height: 1.25; }
    .section-intro p { margin: 12px 0 0; color: var(--muted); }
    .steps-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; }
    .rule-card { display: flex; gap: 12px; align-items: flex-start; min-height: 105px; padding: 16px; border: 1px solid #dce7f3; border-radius: 17px; background: #fff; }
    .rule-number { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 11px; color: #fff; background: var(--blue); font-weight: 900; }
    .rule-card h3 { margin: 0; font-size: 18px; }
    .rule-card p { margin: 4px 0 0; color: #61768a; font-size: 15px; }
    .memory-tip { display: flex; gap: 15px; align-items: center; margin: 0 0 43px; padding: 18px 21px; border-radius: 18px; color: #624e12; background: #fff1bd; }
    .memory-icon { display: grid; place-items: center; flex: none; width: 46px; height: 46px; border-radius: 15px; color: #765800; background: #ffdf70; font-size: 22px; font-weight: 900; }
    .memory-tip strong { color: #433500; }
    footer { padding: 18px 0 30px; border-top: 1px solid #dce6f1; color: #6a7f93; text-align: center; font-size: 14px; }
    @media (max-width: 760px) {
      .hero { grid-template-columns: 1fr; gap: 0; padding-top: 28px; }
      .hero-art { min-height: 175px; }
      .hero-art::before { width: 165px; height: 165px; }
      .hero-art-card { width: 205px; }
      .work-area { grid-template-columns: 1fr; }
      .learning-section { grid-template-columns: 1fr; gap: 18px; padding-top: 35px; }
      .lesson-head { padding: 22px 20px 17px; }
      .problem-form { padding: 17px 20px; }
      .examples { padding: 0 20px 17px; }
      .work-area { padding: 18px 20px 20px; }
      .controls { padding: 0 20px 20px; }
      .result-card { margin-left: 20px; margin-right: 20px; }
    }
    @media (max-width: 480px) {
      body { font-size: 16px; }
      .page { width: min(100% - 20px, 1120px); }
      .topbar { padding-top: 15px; }
      .brand { font-size: 15px; }
      .grade-pill { font-size: 13px; }
      .hero-copy { font-size: 17px; }
      .lesson-head { display: block; }
      .step-tag { display: inline-flex; margin-top: 12px; }
      .field input { width: 100px; }
      .divide-sign { padding-top: 18px; }
      .problem-form { gap: 9px; }
      .primary-button { padding: 0 13px; }
      .board-card, .step-card { padding: 16px; }
      .controls { gap: 8px; }
      .step-button, .auto-button { padding: 0 12px; }
      .timer-box { flex-basis: 100%; }
      .steps-grid { grid-template-columns: 1fr; }
      .rule-card { min-height: 0; }
      .memory-tip { align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
    /* A quiet workspace keeps the lesson itself in focus. */
    :root {
      --ink: #19324a;
      --muted: #61758a;
      --blue: #315fa8;
      --blue-dark: #254b89;
      --blue-soft: #eef4fc;
      --mint-dark: #24755f;
      --line: #dce5ef;
      --shadow: 0 10px 30px rgba(28, 53, 82, .07);
    }
    body { background: #f5f7fa; }
    .page { width: min(960px, calc(100% - 32px)); }
    .topbar { padding: 18px 0 16px; }
    .brand-mark { width: 36px; height: 36px; border-radius: 11px; box-shadow: none; font-size: 20px; }
    .grade-pill { padding: 5px 10px; background: #fff; }
    .hero, .learning-section, .memory-tip, footer { display: none; }
    .lesson-card { border-radius: 18px; box-shadow: var(--shadow); }
    .lesson-head { align-items: center; padding: 20px 24px 14px; }
    .lesson-head h2 { font-size: 23px; }
    .lesson-head p { margin-top: 4px; }
    .step-tag { padding: 5px 10px; background: #f1f5fa; border-color: #e0e7ef; color: #536a81; }
    .problem-form { padding: 14px 24px 12px; background: #fff; }
    .field { gap: 3px; }
    .field label { font-size: 14px; }
    .field input { min-height: 44px; border-radius: 10px; font-size: 20px; }
    .primary-button, .secondary-button, .step-button, .auto-button, .example-button { min-height: 44px; border-radius: 10px; }
    .primary-button { box-shadow: none; }
    .examples { display: block; padding: 0 24px 12px; background: #fff; }
    .examples summary { width: fit-content; color: #45617c; cursor: pointer; font-size: 14px; font-weight: 750; }
    .example-list { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 2px; }
    .example-button { min-height: 36px; border-radius: 9px; font-size: 14px; }
    .work-area { grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px 24px 18px; }
    .board-card, .step-card { border-radius: 14px; }
    .board-card { padding: 15px; background: #fff; }
    .card-label { justify-content: flex-start; margin-bottom: 10px; color: #526981; }
    .division-paper { padding: 12px 10px; border-radius: 12px; }
    .step-card { min-height: 100%; padding: 18px; background: #f7f9fc; }
    .step-card-top { justify-content: flex-end; margin-bottom: 14px; }
    .step-card h3 { font-size: clamp(24px, 3vw, 30px); }
    .step-copy { margin-top: 10px; font-size: 18px; }
    .kid-tip { display: none; }
    .board-caption { display: none; }
    .equation-chip { display: none; }
    .controls { gap: 8px; padding: 0 24px 20px; }
    .step-button { padding: 0 16px; }
    .auto-button { padding: 0 15px; color: #345b4e; background: #eaf4ef; box-shadow: none; }
    .auto-button:hover { background: #deeee6; }
    .timer-box { display: none; }
    .timer-box.active { display: flex; flex-basis: 100%; min-height: 38px; padding: 5px 10px; background: #f7f9fc; }
    .timer-track { display: none; }
    .result-card { margin: 0 24px 20px; }
    @media (max-width: 760px) {
      .work-area { grid-template-columns: 1fr; }
      .step-card { order: -1; min-height: 0; }
      .lesson-head { padding: 18px 18px 13px; }
      .problem-form { padding: 12px 18px; }
      .examples { padding: 0 18px 12px; }
      .work-area { padding: 12px 18px 16px; }
      .controls { padding: 0 18px 18px; }
      .result-card { margin-left: 18px; margin-right: 18px; }
    }
    @media (max-width: 480px) {
      .page { width: min(100% - 20px, 960px); }
      .topbar { padding-top: 12px; }
      .brand { font-size: 15px; }
      .lesson-head { display: flex; }
      .lesson-head h2 { font-size: 20px; }
      .step-tag { margin-top: 0; white-space: nowrap; }
      .problem-form { gap: 8px; }
      .primary-button { padding: 0 13px; }
      .board-card, .step-card { padding: 14px; }
      .step-card-top { margin-bottom: 8px; }
      .step-copy { font-size: 17px; }
      .controls { gap: 7px; }
      .step-button, .auto-button { padding: 0 11px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">÷</span><span>除法練習室</span></div>
      <span class="grade-pill">三年級數學</span>
    </header>

    <main>
      <section class="lesson-card" aria-labelledby="lesson-title">
        <div class="lesson-head">
          <div><h2 id="lesson-title">三位數除以一位數</h2></div>
          <span class="step-tag" id="stepCounter">準備開始</span>
        </div>

        <form class="problem-form" id="problemForm" novalidate>
          <div class="field"><label for="dividendInput">被除數</label><input id="dividendInput" name="dividend" inputmode="numeric" maxlength="3" value="572" aria-describedby="formError"></div>
          <span class="divide-sign" aria-hidden="true">÷</span>
          <div class="field"><label for="divisorInput">除數</label><input id="divisorInput" name="divisor" type="number" inputmode="numeric" min="1" max="9" value="4" aria-describedby="formError"></div>
          <button class="primary-button" type="submit">換題</button>
          <p class="form-error" id="formError" role="alert"></p>
        </form>
        <details class="examples" id="examplePicker">
          <summary>選擇練習題</summary>
          <div class="example-list">
            <button class="example-button" type="button" data-dividend="684" data-divisor="3">684 ÷ 3</button>
            <button class="example-button" type="button" data-dividend="719" data-divisor="6">719 ÷ 6</button>
            <button class="example-button" type="button" data-dividend="314" data-divisor="5">314 ÷ 5</button>
          </div>
        </details>

        <div class="work-area">
          <section class="board-card" aria-label="直式算式板">
            <div class="card-label"><span>直式</span></div>
            <div class="division-paper">
              <div class="quotient-caption">商</div>
              <div class="quotient-row" id="quotientSlots" aria-label="目前的商"></div>
              <div class="division-row">
                <span class="divisor" id="boardDivisor">4</span>
                <span class="bracket" aria-hidden="true"></span>
                <span class="dividend" id="boardDividend"></span>
              </div>
              <div class="work-stack" id="workStack" aria-live="polite"></div>
            </div>
          </section>

          <section class="step-card" aria-labelledby="stepTitle" aria-live="polite">
            <h3 id="stepTitle">先看百位</h3>
            <p class="step-copy" id="stepCopy">5 裡面有幾個 4？想一想，再按下一步。</p>
          </section>
        </div>

        <div class="controls" aria-label="步驟播放控制">
          <button class="step-button" id="prevButton" type="button" disabled>上一步</button>
          <button class="step-button" id="nextButton" type="button">下一步</button>
          <button class="auto-button" id="autoButton" type="button">自動播放（10 秒）</button>
          <div class="timer-box" id="timerBox" aria-live="polite">
            <span class="timer-copy" id="timerCopy">下一步即將出現</span>
            <span class="timer-number" id="timerNumber">10 秒</span>
          </div>
        </div>

        <div class="result-card" id="resultCard" role="status">
          <strong id="resultAnswer"></strong>
          <span class="result-check" id="resultCheck"></span>
        </div>
      </section>

    </main>
  </div>

  <script>
    const dividendInput = document.getElementById("dividendInput");
    const divisorInput = document.getElementById("divisorInput");
    const problemForm = document.getElementById("problemForm");
    const formError = document.getElementById("formError");
    const examplePicker = document.getElementById("examplePicker");
    const quotientSlots = document.getElementById("quotientSlots");
    const boardDividend = document.getElementById("boardDividend");
    const boardDivisor = document.getElementById("boardDivisor");
    const workStack = document.getElementById("workStack");
    const stepCounter = document.getElementById("stepCounter");
    const stepTitle = document.getElementById("stepTitle");
    const stepCopy = document.getElementById("stepCopy");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const autoButton = document.getElementById("autoButton");
    const timerBox = document.getElementById("timerBox");
    const timerCopy = document.getElementById("timerCopy");
    const timerNumber = document.getElementById("timerNumber");
    const resultCard = document.getElementById("resultCard");
    const resultAnswer = document.getElementById("resultAnswer");
    const resultCheck = document.getElementById("resultCheck");

    let lesson = null;
    let stepIndex = 0;
    let playTimer = null;
    let nextAt = 0;

    function makeLesson(dividend, divisor) {
      const text = String(dividend);
      const firstDigit = Number(text[0]);
      const firstLength = firstDigit >= divisor ? 1 : 2;
      const groups = [];
      let position = firstLength;
      let current = Number(text.slice(0, firstLength));

      while (position <= text.length) {
        const quotientDigit = Math.floor(current / divisor);
        const product = quotientDigit * divisor;
        const remainder = current - product;
        groups.push({ current: current, quotientDigit: quotientDigit, product: product, remainder: remainder, position: position - 1, nextDigit: position < text.length ? Number(text[position]) : null });
        if (position < text.length) current = remainder * 10 + Number(text[position]);
        position += 1;
      }

      const quotient = groups.map(function (group) { return group.quotientDigit; }).join("");
      const finalRemainder = groups[groups.length - 1].remainder;
      const steps = [{ type: "start", group: groups[0], groupIndex: 0 }];
      groups.forEach(function (group, index) {
        steps.push({ type: "estimate", group: group, groupIndex: index });
        steps.push({ type: "multiply", group: group, groupIndex: index });
        steps.push({ type: "subtract", group: group, groupIndex: index });
        if (index < groups.length - 1) {
          steps.push({ type: "bring", group: group, groupIndex: index, newCurrent: group.remainder * 10 + group.nextDigit });
        }
      });
      steps.push({ type: "finish", group: groups[groups.length - 1], groupIndex: groups.length - 1 });
      return { dividend: Number(dividend), divisor: divisor, text: text, firstLength: firstLength, groups: groups, quotient: quotient, remainder: finalRemainder, steps: steps };
    }

    function setProblem(dividend, divisor) {
      stopAuto();
      formError.textContent = "";
      const cleanDividend = String(dividend).trim();
      const cleanDivisor = Number(divisor);
      if (!/^\d{3}$/.test(cleanDividend) || Number(cleanDividend) < 100 || Number(cleanDividend) > 999) {
        formError.textContent = "請輸入100到999之間的三位數。";
        return false;
      }
      if (!Number.isInteger(cleanDivisor) || cleanDivisor < 1 || cleanDivisor > 9) {
        formError.textContent = "除數請輸入1到9的一位數。";
        return false;
      }
      lesson = makeLesson(Number(cleanDividend), cleanDivisor);
      dividendInput.value = cleanDividend;
      divisorInput.value = String(cleanDivisor);
      stepIndex = 0;
      resultCard.classList.remove("show");
      renderStep();
      return true;
    }

    function getStepWords(step) {
      const group = step.group;
      const divisor = lesson.divisor;
      if (step.type === "start") {
        if (lesson.firstLength === 1) {
          return { title: "先看百位", copy: lesson.text[0] + " 裡面有幾個 " + divisor + "？想一想，再按下一步。" };
        }
        return { title: "先看前兩位", copy: lesson.text[0] + " 比 " + divisor + " 小，先看 " + lesson.text.slice(0, 2) + "。" };
      }
      if (step.type === "estimate") {
        return { title: "估商", copy: group.current + " 裡有 " + group.quotientDigit + " 個 " + divisor + "，商先寫 " + group.quotientDigit + "。" };
      }
      if (step.type === "multiply") {
        return { title: "相乘", copy: group.quotientDigit + " × " + divisor + " = " + group.product + "，把 " + group.product + " 寫在下面。" };
      }
      if (step.type === "subtract") {
        return { title: "相減", copy: group.current + " − " + group.product + " = " + group.remainder + "，還剩 " + group.remainder + "。" };
      }
      if (step.type === "bring") {
        return { title: "落下一位", copy: "把 " + group.nextDigit + " 落下來，和 " + group.remainder + " 合成 " + step.newCurrent + "。" };
      }
      return { title: "完成", copy: "商是 " + lesson.quotient + "，餘數是 " + lesson.remainder + "。" };
    }

    function renderBoard(step) {
      const activeGroup = step.groupIndex;
      const startSlot = lesson.firstLength - 1;
      let quotientHtml = "";
      for (let slot = 0; slot < 3; slot += 1) {
        const groupIndex = slot - startSlot;
        const group = lesson.groups[groupIndex];
        const isFilled = groupIndex >= 0 && groupIndex <= activeGroup && (step.type !== "start" || groupIndex < activeGroup);
        const isActive = groupIndex === activeGroup && step.type !== "start" && step.type !== "finish";
        const classes = "quotient-slot" + (isFilled ? " filled" : "") + (isActive ? " active" : "");
        quotientHtml += "<span class=\"" + classes + "\">" + (isFilled ? group.quotientDigit : "&nbsp;") + "</span>";
      }
      quotientSlots.innerHTML = quotientHtml;
      boardDividend.innerHTML = lesson.text.split("").map(function (digit, index) {
        const active = step.type === "start" ? index < lesson.firstLength : step.type === "bring" ? index === step.group.position + 1 : index === step.group.position;
        return "<span class=\"dividend-digit" + (active ? " active" : "") + "\">" + digit + "</span>";
      }).join("");
      boardDivisor.textContent = String(lesson.divisor);


      const group = step.group;
      function alignedRow(value, endPosition, operation, rowClass) {
        const digits = String(value).split("");
        const firstPosition = endPosition - digits.length + 1;
        let html = "<div class='work-grid-row " + rowClass + "'>";
        if (operation) {
          const operatorColumn = firstPosition > 0 ? firstPosition + 1 : 1;
          html += "<span class='work-operation' style='grid-column:" + operatorColumn + "'>" + operation + "</span>";
        }
        for (let column = 0; column < 3; column += 1) {
          const digitIndex = column - firstPosition;
          if (digitIndex >= 0 && digitIndex < digits.length) {
            html += "<span class='work-digit' style='grid-column:" + (column + 2) + "'>" + digits[digitIndex] + "</span>";
          }
        }
        return html + "</div>";
      }
      function alignedRule(endPosition, digitCount) {
        const firstPosition = endPosition - digitCount + 1;
        return "<div class='work-rule' style='grid-column:" + (firstPosition + 2) + " / span " + digitCount + "'></div>";
      }
      function alignedMark(position, symbol, rowClass) {
        let html = "<div class='work-grid-row " + rowClass + "'><span class='work-operation'></span>";
        for (let column = 0; column < 3; column += 1) {
          html += "<span class='work-digit' style='grid-column:" + (column + 2) + "'>" + (column === position ? symbol : "") + "</span>";
        }
        return html + "</div>";
      }
      function completedGroupRows(item) {
        let html = alignedRow(item.product, item.position, "−", "work-product");
        html += alignedRule(item.position, String(item.product).length);
        if (item.nextDigit !== null) {
          const nextNumber = item.remainder * 10 + item.nextDigit;
          html += alignedMark(item.position + 1, "↓", "work-drop-arrow");
          html += alignedRow(nextNumber, item.position + 1, "", "work-new-number");
        } else {
          html += alignedRow(item.remainder, item.position, "", "work-remainder");
        }
        return html;
      }

      let stackMarkup = "";
      for (let priorIndex = 0; priorIndex < step.groupIndex; priorIndex += 1) {
        stackMarkup += completedGroupRows(lesson.groups[priorIndex]);
      }
      const showProduct = step.type === "multiply" || step.type === "subtract" || step.type === "bring" || step.type === "finish";
      const showRemainder = (step.type === "subtract" || step.type === "bring" || step.type === "finish") && group.nextDigit === null;
      if (showProduct) {
        stackMarkup += alignedRow(group.product, group.position, "−", "work-product");
        stackMarkup += alignedRule(group.position, String(group.product).length);
      }
      if (showRemainder) stackMarkup += alignedRow(group.remainder, group.position, "", "work-remainder");
      if (step.type === "bring") {
        stackMarkup += alignedMark(group.position + 1, "↓", "work-drop-arrow");
        stackMarkup += alignedRow(step.newCurrent, group.position + 1, "", "work-new-number");
      }
      workStack.innerHTML = stackMarkup;

    }

    function renderStep() {
      const step = lesson.steps[stepIndex];
      const words = getStepWords(step);
      stepCounter.textContent = "步驟 " + (stepIndex + 1) + " / " + lesson.steps.length;
      stepTitle.textContent = words.title;
      stepCopy.textContent = words.copy;
      renderBoard(step);
      prevButton.disabled = stepIndex === 0;
      nextButton.disabled = stepIndex === lesson.steps.length - 1;
      if (step.type === "finish") {
        resultAnswer.textContent = lesson.dividend + " ÷ " + lesson.divisor + " = " + lesson.quotient + (lesson.remainder ? " 餘 " + lesson.remainder : "");
        resultCheck.textContent = lesson.divisor + " × " + lesson.quotient + " + " + lesson.remainder + " = " + lesson.dividend + "，答案檢查正確！";
        resultCard.classList.add("show");
      } else resultCard.classList.remove("show");
      if (playTimer) resetTimerDisplay();
    }

    function resetTimerDisplay() {
      timerNumber.textContent = "10 秒";
      timerCopy.textContent = "下一步即將出現";
    }

    function stopAuto() {
      if (playTimer) window.clearInterval(playTimer);
      playTimer = null;
      autoButton.textContent = "自動播放（10 秒）";
      timerBox.classList.remove("active");
      resetTimerDisplay();
    }

    function startAuto() {
      if (playTimer) {
        window.clearInterval(playTimer);
        playTimer = null;
        autoButton.textContent = "自動播放（10 秒）";
        timerBox.classList.add("active");
        timerCopy.textContent = "已暫停，按自動播放繼續。";
        return;
      }
      renderStep();
      autoButton.textContent = "暫停";
      timerBox.classList.add("active");
      timerCopy.textContent = "下一步即將出現";
      nextAt = Date.now() + 10000;
      playTimer = window.setInterval(function () {
        const remaining = Math.max(0, nextAt - Date.now());
        const seconds = Math.ceil(remaining / 1000);
        timerNumber.textContent = seconds + " 秒";
        if (remaining <= 0) {
          if (stepIndex >= lesson.steps.length - 1) {
            stepIndex = 0;
            renderStep();
            timerCopy.textContent = "已回到第一步，繼續循環播放。";
          } else {
            stepIndex += 1;
            renderStep();
            timerCopy.textContent = "下一步即將出現";
          }
          nextAt = Date.now() + 10000;
        }
      }, 100);
    }

    problemForm.addEventListener("submit", function (event) {
      event.preventDefault();
      setProblem(dividendInput.value, divisorInput.value);
    });
    document.querySelectorAll(".example-button").forEach(function (button) {
      button.addEventListener("click", function () {
        examplePicker.open = false;
        setProblem(button.dataset.dividend, button.dataset.divisor);
      });
    });
    prevButton.addEventListener("click", function () {
      stopAuto();
      if (stepIndex > 0) { stepIndex -= 1; renderStep(); }
    });
    nextButton.addEventListener("click", function () {
      stopAuto();
      if (stepIndex < lesson.steps.length - 1) { stepIndex += 1; renderStep(); }
    });
    autoButton.addEventListener("click", startAuto);

    setProblem("572", "4");
  </script>
</body>
</html>
