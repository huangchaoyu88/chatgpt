<!doctype html>
<html lang="zh-Hant-TW"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7e7">
<meta name="description" content="兔兔方向大冒險：有注音、語音和一步一步數數提示的上下左右遊戲。"><title>兔兔方向大冒險</title>
<link rel="stylesheet" href="style.css?v=2.0.0">
<script defer src="phonetics.js?v=2.0.0"></script><script defer src="voices.js?v=2.0.0"></script><script defer src="text.js?v=2.0.0"></script><script defer src="engine.js?v=2.0.0"></script><script defer src="audio.js?v=2.0.0"></script><script defer src="game.js?v=2.0.0"></script>
</head><body><main class="app">
<header class="top"><div class="brand"><span aria-hidden="true">🐇</span><span data-zh>兔兔探險隊</span></div><button id="sound" class="small" aria-pressed="true"><span data-zh>🔊 聲音開</span></button></header>
<div id="storageNote" class="notice" role="status" hidden></div>
<section id="home"><div class="hero"><span class="rabbit" aria-hidden="true">🐰</span><h1 data-zh>兔兔方向大冒險</h1><p data-zh>跟著兔兔，一起找寶藏！</p></div>
<div class="compass" aria-label="上、下、左、右的位置"><div class="north" data-zh>⬆ 上</div><div class="west" data-zh>⬅ 左</div><span class="center" aria-hidden="true">🐰</span><div class="east" data-zh>右 ➡</div><div class="south" data-zh>⬇ 下</div></div>
<div class="card home-card"><h2 data-zh>🗺 四關尋寶</h2><div id="stageMap" class="stage-map"></div><p class="rules" data-zh>看起點 → 跟箭頭 → 選數字</p><p data-zh>共 20 題，每個方向都會練習。</p><button id="resume" class="primary" hidden></button><button id="start" class="primary" data-zh>🐾 開始尋寶</button><p class="fine" data-zh>點開始就有語音，也能隨時再聽一次。</p><p class="fine" data-zh>答對就有星星，答錯可以再試。</p></div><p class="version">🐇 2.0</p></section>
<section id="play" hidden><div class="game-top"><button id="pause" class="small" data-zh>⏸ 暫停</button><h2 id="roundName"></h2><span id="stars" aria-label="已收集星星"></span></div><div class="progress" id="progress" role="progressbar" aria-label="完成題目" aria-valuemin="0" aria-valuemax="20"><div id="bar"></div></div><p id="questionNumber" class="question-number"></p>
<div class="card game-card"><div id="directionCue"></div><div id="board"></div><h3 id="questionText"></h3><div class="tools"><button id="replay" class="small" data-zh>🔊 再聽一次</button><button id="help" class="small help" data-zh>🐾 一起數</button></div><p id="audioStatus" class="fine" role="status"></p><div id="answers" class="answers" role="group" aria-label="選一個數字回答"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button id="next" class="primary" hidden></button></div></section>
<section id="checkpoint" class="card checkpoint" hidden><div id="chest" class="chest" aria-hidden="true">🎁</div><h2 id="checkpointTitle" tabindex="-1"></h2><p id="checkpointMessage"></p><div id="stageStars" class="stage-stars" aria-label="五顆星星">⭐ ⭐ ⭐ ⭐ ⭐</div><button id="continue" class="primary"></button></section>
<section id="done" class="card result" hidden><div class="chest" aria-hidden="true">🏆</div><h2 id="resultTitle" tabindex="-1" data-zh>找到寶藏了！</h2><p id="resultStars"></p><p id="resultIndependent"></p><div id="directionResults" class="direction-results"></div><p class="fine" data-zh>一起數也很棒！多練一次，更熟悉方向。</p><button id="again" class="primary" data-zh>🐰 再玩一次</button><button id="homeButton" class="small" data-zh>回首頁</button></section>
<div id="restartPrompt" class="modal" role="dialog" aria-modal="true" aria-labelledby="restartTitle" hidden><div class="card"><h2 id="restartTitle" data-zh>重新開始？</h2><p data-zh>這次進度會重新計算。</p><button id="cancelRestart" class="primary" data-zh>繼續這次尋寶</button><button id="confirmRestart" class="small" data-zh>重新開始</button></div></div>
<audio id="voice" preload="auto" playsinline></audio>
</main></body></html>
