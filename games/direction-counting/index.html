<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5df">
<title>兔兔方向大冒險</title>
<style>
:root{--ink:#403c49;--muted:#81796e;--paper:#fffdf7;--line:#efe4d0;--coral:#ef8068;--orange:#f5ad4e;--mint:#e2f3e8;--green:#43834d;--lavender:#f1eaff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 5%,#fff 0 5%,transparent 25%),linear-gradient(160deg,#fff5df,#f8eee5 58%,#eaf4ed);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold","Noto Sans TC",system-ui,sans-serif}
button{font:inherit;touch-action:manipulation;cursor:pointer}
.app{width:min(100%,540px);min-height:100vh;margin:auto;padding:16px 17px 25px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.brand{font-size:14px;font-weight:950;color:#8b7c65;letter-spacing:.04em}
.sound-toggle{border:0;background:#fff;border-radius:99px;padding:9px 13px;color:var(--ink);font-size:14px;font-weight:850;box-shadow:0 3px 0 #eadfc9}
.hero{text-align:center;padding:5px 0 13px}
.mascot{font-size:64px;line-height:1.05;filter:drop-shadow(0 5px 0 #f3d9a6);animation:bob 2s ease-in-out infinite}
h1{font-size:clamp(28px,7vw,38px);margin:6px 0 3px;line-height:1.2}
.subtitle{margin:0;color:var(--muted);font-size:15px;font-weight:750;line-height:1.6}
.direction-compass{width:min(100%,268px);margin:13px auto 7px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
.compass-cell{min-height:48px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:15px;font-size:15px;font-weight:1000;box-shadow:0 3px 0 rgba(71,52,33,.08)}
.compass-cell b{font-size:20px}
.compass-up{background:#eee7ff;color:#6648a5}.compass-left{background:#deefff;color:#2567a8}.compass-right{background:#ffe6df;color:#bd5143}.compass-down{background:#e1f4e7;color:#31794b}.compass-center{background:#fff5d7;font-size:27px}
.compass-note{margin:6px 0 12px;color:#746b5f;font-size:13px;font-weight:850}
.home-card,.game-card,.checkpoint-card{background:var(--paper);border:2px solid var(--line);border-radius:27px;padding:19px;box-shadow:0 7px 0 #eee3ce}
.section-label{font-size:13px;font-weight:950;letter-spacing:.09em;color:#9a8d78;margin:1px 0 11px}
.stage-map{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stage-tile{position:relative;text-align:left;min-height:91px;padding:12px 11px;border:2px solid transparent;border-radius:18px;background:#fff4d9;box-shadow:0 3px 0 rgba(71,52,33,.08)}
.stage-tile:nth-child(2){background:#e8f6ea}.stage-tile:nth-child(3){background:#f2eaff}.stage-tile:nth-child(4){background:#ffe8df}
.stage-tile .tile-icon{font-size:22px;display:block;margin-bottom:3px}
.stage-tile b{display:block;font-size:14px;line-height:1.35}
.stage-tile small{display:block;color:#746d64;font-size:12px;font-weight:750;margin-top:3px}
.adventure-note{margin:13px 0 15px;padding:11px 12px;border-radius:15px;background:#f4f0ff;color:#685f79;font-size:13px;font-weight:750;line-height:1.55}
.btn{border:0;border-radius:17px;background:var(--coral);color:#fff;font-size:18px;font-weight:1000;padding:14px 21px;box-shadow:0 5px 0 #d96658}
.btn:active,.answer:active{transform:translateY(3px);box-shadow:none}
.btn.full{width:100%}
.btn.secondary{background:#8ebfc0;box-shadow:0 5px 0 #6c9e9f}
.record{text-align:center;color:#927b54;font-size:13px;font-weight:900;margin:13px 0 1px;min-height:20px}
.foot{text-align:center;color:#a29784;font-size:12px;margin-top:auto;padding-top:17px}
.hidden{display:none!important}
.game-head{display:flex;align-items:center;gap:9px;margin:7px 0 13px}
.back{flex:none;border:0;background:#f2ebdc;width:42px;height:42px;border-radius:15px;font-size:24px;color:var(--ink)}
.progress-wrap{flex:1;min-width:0}
.progress-label{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#817667;font-weight:900;margin-bottom:6px}
.progress{height:12px;background:#eee6d7;border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ef8068,#ffd15f);border-radius:99px;transition:width .35s}
.streak,.hint-count{white-space:nowrap;font-size:13px;font-weight:950;background:#fff0ed;padding:9px 10px;border-radius:13px}
.hint-count{border:0;background:#eee8ff;color:#695b8a}.hint-count:disabled{opacity:.48;cursor:default}
.game-card{padding:18px 15px 17px;text-align:center}
.instruction{font-size:15px;font-weight:900;color:#84796b;margin:1px 0 9px}
.direction-board{margin:9px 0 11px}
.direction-guide{min-height:51px;display:flex;align-items:center;gap:9px;padding:5px 13px;border:2px solid;border-radius:17px;font-size:16px;font-weight:1000;line-height:1.3;margin:0 0 8px}
.direction-guide.dir-left{justify-content:flex-start;background:#deefff;border-color:#83bdf1;color:#2567a8}
.direction-guide.dir-right{justify-content:flex-end;flex-direction:row-reverse;background:#ffe6df;border-color:#f1a08c;color:#bd5143}
.direction-guide.dir-up{justify-content:center;background:#eee7ff;border-color:#b8a2ec;color:#6648a5}
.direction-guide.dir-down{justify-content:center;flex-direction:row-reverse;background:#e1f4e7;border-color:#93cf9f;color:#31794b}
.cue-arrow{font-size:34px;line-height:1;animation:arrow-nudge .65s ease-in-out infinite alternate}
.d-left .line-wrap{background:#eff7ff;border-color:#83bdf1}.d-right .line-wrap{background:#fff2ee;border-color:#f1a08c}.d-up .line-wrap{background:#f4f0ff;border-color:#b8a2ec}.d-down .line-wrap{background:#eff9f1;border-color:#93cf9f}
.line-wrap{position:relative;margin:10px 0 13px;padding:14px 7px 11px;border-radius:20px;background:#f2f9ee;border:2px dashed #c8ddb8}
.line{display:flex;justify-content:space-around;align-items:center;gap:4px;min-height:74px}
.animal{flex:1;max-width:70px;height:67px;border-radius:19px;background:#fff;display:grid;place-items:center;font-size:38px;box-shadow:0 4px 0 #e1ead8;position:relative;transition:transform .2s,outline .2s}
.animal.selected{outline:4px solid #f5aa48;transform:translateY(-4px);animation:glow 1.1s ease-in-out infinite alternate}.animal.selected::after{content:"⭐";position:absolute;right:-6px;top:-14px;font-size:17px;z-index:2}.animal.count-start{background:#dff3dc}.start-badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);z-index:3;padding:3px 6px;border-radius:9px;background:#348b54;color:#fff;white-space:nowrap;font-size:11px;font-weight:1000;box-shadow:0 2px 0 #236b3b}
.animal.hint-start{background:#fff1b9;outline:3px solid #8bbf73;animation:pulse .55s ease-in-out 2}
.direction-labels{display:flex;justify-content:space-between;color:#789076;font-size:13px;font-weight:950;margin-top:9px}
.vertical .line{flex-direction:column;min-height:auto}
.vertical .animal{flex:none;width:70px;height:50px;font-size:33px}
.vertical .direction-labels{height:102px;flex-direction:column;justify-content:space-between;align-items:center;margin:0}
.vertical.line-wrap{display:flex;align-items:center;justify-content:center;gap:15px}
.question-copy{font-size:22px;font-weight:1000;line-height:1.5;margin:4px 2px 11px}
.question-copy strong{color:#e87559}
.number-answers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.answer{border:2px solid #eee3d2;background:#fff;border-radius:16px;min-height:62px;font-size:27px;font-weight:1000;color:var(--ink);box-shadow:0 4px 0 #f0e8dc}
.answer.correct{background:#dff3dc;border-color:#8dcf95;color:#397447}
.answer.wrong{background:#ffebe5;border-color:#f3a08f;animation:shake .24s}
.feedback{min-height:28px;margin:10px 0 0;font-size:15px;font-weight:950}
.feedback.good{color:var(--green)}.feedback.bad{color:#c56853}
.small-hint{color:#928878;font-size:12px;margin:8px 0 1px;font-weight:750;min-height:20px}
.next-row{margin-top:13px}
.next-row .btn{font-size:16px;padding:12px 20px}
.checkpoint-card{text-align:center;margin-top:24px;padding:22px 17px}
.checkpoint-emoji{font-size:64px;line-height:1.2;animation:bob 1.8s ease-in-out infinite}
.checkpoint-card h2,.result h2{font-size:28px;margin:7px 0 6px}
.checkpoint-card p,.result p{font-size:15px;color:#756b60;font-weight:750;line-height:1.6;margin:6px 0}
.badge-row{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:10px auto 17px;max-width:310px;font-size:24px}
.badge{filter:grayscale(1);opacity:.34;transform:scale(.9)}
.badge.earned{filter:none;opacity:1;animation:pop .5s ease-out}
.result{text-align:center;padding:20px 12px}
.result-emoji{font-size:68px;animation:bob 1.8s ease-in-out infinite}
.result-score{background:#fff3d2;border-radius:17px;padding:13px;font-size:20px;font-weight:1000;margin:13px 0}
.best-line{color:#9a7943;font-size:14px;font-weight:900;margin:-4px 0 12px}
.between{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.spark{position:fixed;pointer-events:none;font-size:24px;animation:pop .7s ease-out forwards;z-index:5}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes arrow-nudge{to{transform:translateX(4px) scale(1.08)}}
@keyframes pop{to{transform:translateY(-75px) scale(1.45);opacity:0}}
@keyframes glow{to{box-shadow:0 0 0 8px #f6d58355}}
@keyframes pulse{50%{transform:scale(1.13)}}
@keyframes bob{50%{transform:translateY(-5px)}}
ruby{ruby-position:over;ruby-align:center}
ruby rt{font-size:.43em;line-height:1;color:#887967;font-weight:700}
@media(max-width:380px){.app{padding:12px}.home-card,.game-card{padding:15px}.stage-tile{min-height:86px;padding:9px}.stage-tile b{font-size:13px}.game-head{gap:6px}.streak,.hint-count{padding:8px 7px;font-size:12px}.animal{height:58px;font-size:32px}.line{min-height:65px}.question-copy{font-size:20px}}

</head>
<body>
<main class="app">
<div class="top"><div class="brand">🐇 兔兔探險隊</div><button class="sound-toggle" id="soundToggle" aria-label="切換 Edge TTS 語音">🔊 Edge TTS 開</button></div>
<section id="home">
<header class="hero"><div class="mascot">🐰</div><h1>兔兔方向大冒險</h1><p class="subtitle">陪兔兔找寶藏，認識左、右、上、下！</p><div class="direction-compass"><span></span><span class="compass-cell compass-up"><b>⬆</b> 上</span><span></span><span class="compass-cell compass-left"><b>⬅</b> 左</span><span class="compass-cell compass-center">🐰</span><span class="compass-cell compass-right">右 <b>➡</b></span><span></span><span class="compass-cell compass-down"><b>⬇</b> 下</span><span></span></div><p class="compass-note">看箭頭，從起點開始數！</p></header>
<div class="home-card">
<div class="section-label">🗺 尋寶地圖｜四關等你挑戰</div>
<div class="stage-map">
<div class="stage-tile"><span class="tile-icon">🌱</span><b>第一關｜左右暖身</b><small>3–4 隻動物</small></div>
<div class="stage-tile"><span class="tile-icon">🧭</span><b>第二關｜四方位探險</b><small>4 隻動物</small></div>
<div class="stage-tile"><span class="tile-icon">🐾</span><b>第三關｜動物隊伍挑戰</b><small>4–5 隻動物</small></div>
<div class="stage-tile"><span class="tile-icon">💎</span><b>第四關｜寶藏終極關</b><small>5–6 隻動物</small></div>
</div>
<div class="adventure-note">⭐ 共 20 題｜答對收集星星，連對三題可拿到魔法提示！答錯也能再試一次。</div>
<button class="btn full" id="start">🐰 開始尋寶！</button>
<div class="record" id="homeBest"></div>
</div>
<div class="foot">慢慢看、跟著數，兔兔陪你一起練習 🥕</div>
</section>

<section id="play" class="hidden">
<div class="game-head">
<button class="back" id="back" aria-label="回首頁">‹</button>
<div class="progress-wrap"><div class="progress-label"><span id="roundName"></span><span id="scoreText"></span></div><div class="progress"><i id="bar"></i></div></div>
<div class="streak" id="streak">🔥 0</div><button class="hint-count" id="hintButton">🪄 0</button>
</div>
<div class="game-card"><div id="question"></div></div>
</section>

<section id="checkpoint" class="hidden">
<div class="checkpoint-card"><div class="checkpoint-emoji" id="checkpointEmoji">🎁</div><h2 id="checkpointTitle"></h2><p id="checkpointMsg"></p><div class="badge-row" id="checkpointBadges"></div><button class="btn full" id="continue">打開寶箱！</button></div>
</section>

<section id="done" class="hidden">
<div class="game-card result"><div class="result-emoji" id="resultEmoji">🏆</div><h2 id="resultTitle">尋寶成功！</h2><p id="resultMsg"></p><div class="result-score" id="resultScore"></div><div class="best-line" id="bestLine"></div><div class="badge-row" id="badges"></div><div class="between"><button class="btn" id="again">再玩一次</button><button class="btn secondary" id="homeBtn">回首頁</button></div></div>
</section>
</main>

function annotate(root){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
 while(walker.nextNode())if(/[\u3400-\u9fff]/.test(walker.currentNode.nodeValue))nodes.push(walker.currentNode);
 for(const node of nodes){
  if(node.parentElement.closest('ruby,rt,script,style'))continue;
  const frag=document.createDocumentFragment();
  for(const ch of node.nodeValue){
   if(/[\u3400-\u9fff]/.test(ch)&&bopomofo[ch]){
    const ruby=document.createElement('ruby');ruby.append(document.createTextNode(ch));
    const rt=document.createElement('rt');rt.textContent=bopomofo[ch];ruby.append(rt);frag.append(ruby);
   }else frag.append(document.createTextNode(ch));
  }
  node.replaceWith(frag);
 }
}
const $=id=>document.getElementById(id);
let questions=[],idx=0,score=0,streak=0,hints=0,answered=false,firstTry=true,soundOn=true,current=null,stageStars=[0,0,0,0];
const stageNames=stageInfo.map(x=>x.title);
function show(id){['home','play','checkpoint','done'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const speechLines={
 questionLeft:'請從左邊開始數。圈起來的小動物，從左邊數來第幾個？',
 questionRight:'請從右邊開始數。圈起來的小動物，從右邊數來第幾個？',
 questionUp:'請從上面開始數。圈起來的小動物，從上面數來第幾個？',
 questionDown:'請從下面開始數。圈起來的小動物，從下面數來第幾個？',
 correct:'答對了！兔兔找到寶物了！',combo:'連對三題！獲得一個魔法提示！',
 retry:'再看一次箭頭，慢慢數一數！',hint:'魔法提示：先從綠色小動物開始數！',
 checkpoint:'這一關完成了！打開寶箱，準備下一關！',
 finalCheckpoint:'四關完成！兔兔找到最後一張藏寶圖了！',
 finish:'太棒了！兔兔大冒險完成！'
};
let activeAudio=null,speechSequence=0;
function cancelSpeech(){speechSequence++;if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;activeAudio=null}if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function speakOnDevice(text){if(!('speechSynthesis'in window))return;const utterance=new SpeechSynthesisUtterance(text);utterance.lang='zh-TW';utterance.rate=.88;utterance.pitch=1.08;window.speechSynthesis.speak(utterance)}
async function say(key){
 if(!soundOn)return;const text=speechLines[key];if(!text)return;cancelSpeech();const requestId=speechSequence;
 const player=new Audio('./audio/'+key+'.mp3');activeAudio=player;player.onended=()=>{if(activeAudio===player)activeAudio=null};
 try{await player.play()}catch(error){if(soundOn&&requestId===speechSequence)speakOnDevice(text)}
}
function bestScore(){try{return +(localStorage.getItem('bunny-direction-best')||0)}catch(e){return 0}}
function setHomeBest(){$('homeBest').textContent='🏆 最高紀錄：'+bestScore()+' 顆星';annotate($('homeBest'))}
function updateSound(){$('soundToggle').textContent=soundOn?'🔊 Edge TTS 開':'🔇 Edge TTS 關';annotate($('soundToggle'))}
$('soundToggle').onclick=()=>{soundOn=!soundOn;updateSound();if(!soundOn)cancelSpeech();else if(current)say('question'+({左:'Left',右:'Right',上:'Up',下:'Down'}[current.side]))};
$('start').onclick=()=>startGame();
$('again').onclick=()=>startGame();
$('homeBtn').onclick=()=>{cancelSpeech();show('home')};
$('back').onclick=()=>{cancelSpeech();show('home')};
$('continue').onclick=()=>{cancelSpeech();if(idx>=20){finish()}else{show('play');renderQuestion()}};
$('hintButton').onclick=useHint;
function startGame(){
 score=0;idx=0;streak=0;hints=0;stageStars=[0,0,0,0];questions=makeQuestions();show('play');renderQuestion();
}
function makeQuestions(){
 const all=[];
 stageInfo.forEach((stage,level)=>{
  for(let j=0;j<5;j++){
   const count=stage.min+Math.floor(Math.random()*(stage.max-stage.min+1));
   const line=shuffle(animals).slice(0,count),target=Math.floor(Math.random()*count);
   const side=stage.dirs[Math.floor(Math.random()*stage.dirs.length)];
   const fromStart=side==='左'||side==='上';
   const n=fromStart?target+1:count-target;
   all.push({level,count,line,target,side,n,firstTry:true});
  }
 });
 return all;
}
function renderQuestion(){
 if(idx>=20){finish();return}
 answered=false;firstTry=true;current=questions[idx];
 const level=current.level;
 $('roundName').textContent=stageNames[level];$('scoreText').textContent='⭐ '+score+' / 20';
 $('streak').textContent='🔥 '+streak;refreshHintButton();
 $('bar').style.width=((idx+1)/20*100)+'%';
 const q=current,vertical=q.side==='上'||q.side==='下';
 const directionClass={左:'left',右:'right',上:'up',下:'down'}[q.side];
 const arrows={左:'➡️',右:'⬅️',上:'⬇️',下:'⬆️'};
 const startText={左:'從左邊開始數',右:'從右邊開始數',上:'從上面開始數',下:'從下面開始數'};
 const labels=vertical?'<span>⬆ 上方</span><span>⬇ 下方</span>':'<span>⬅ 左邊</span><span>右邊 ➡</span>';
 const fromStart=q.side==='左'||q.side==='上',startIndex=fromStart?0:q.count-1;
 const cue='<div class="direction-guide dir-'+directionClass+'"><span class="cue-arrow">'+arrows[q.side]+'</span><span>'+startText[q.side]+'</span></div>';
 const animalsHtml=q.line.map((e,i)=>'<div class="animal '+(i===q.target?'selected ':'')+(i===startIndex?'count-start':'')+'" id="animal'+i+'">'+(i===startIndex?'<span class="start-badge">起點</span>':'')+e+'</div>').join('');
 const choices=Array.from({length:q.count},(_,i)=>'<button class="answer" data-n="'+(i+1)+'">'+(i+1)+'</button>').join('');
 const cueBefore=q.side==='下'?'':cue,cueAfter=q.side==='下'?cue:'';
 $('question').innerHTML='<div class="instruction">跟著大箭頭，從綠色起點開始數</div>'+
 '<div class="direction-board d-'+directionClass+'">'+cueBefore+'<div class="line-wrap'+(vertical?' vertical':'')+'"><div class="line">'+animalsHtml+'</div><div class="direction-labels">'+labels+'</div></div>'+cueAfter+'</div>'+
 '<div class="question-copy">⭐ 圈起來的小動物，從 <strong>'+q.side+(vertical?'面':'邊')+'數來第幾個？</strong></div>'+
 '<div class="number-answers">'+choices+'</div><div class="feedback" id="feedback" aria-live="polite"></div>'+
 '<div class="small-hint" id="helper">先找到綠色「起點」，再一個一個數喔！</div><div class="next-row" id="nextRow"></div>';
 annotate($('question'));
 document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.n));
 say('question'+({左:'Left',右:'Right',上:'Up',下:'Down'}[q.side]));
}
function answer(n){
 if(answered)return;
 const q=current,correct=n===q.n,buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.classList.remove('wrong'));
 if(correct){
  answered=true;buttons.forEach(b=>{if(+b.dataset.n===q.n)b.classList.add('correct')});
  if(firstTry){score++;stageStars[q.level]++;streak++}else{streak=0}
  const combo=firstTry&&streak>0&&streak%3===0;
  if(combo)hints++;
  const msg=firstTry?(combo?'連對三題！獲得一個魔法提示！':'答對了！兔兔找到寶物了！'):'答對了！兔兔找到寶物了！';
  setFeedback(msg,true);
  say(combo?'combo':'correct');
  $('streak').textContent='🔥 '+streak;$('scoreText').textContent='⭐ '+score+' / 20';refreshHintButton();
  spark(combo?8:4);
  addNextButton();
 }else{
  firstTry=false;streak=0;$('streak').textContent='🔥 0';refreshHintButton();
  buttons.forEach(b=>{if(+b.dataset.n===n)b.classList.add('wrong')});
  setFeedback('再看一次箭頭，慢慢數一數！',false);say('retry');
 }
}
function refreshHintButton(){$('hintButton').textContent='🪄 '+hints;$('hintButton').disabled=hints<1||answered}
function setFeedback(text,good){const f=$('feedback');f.textContent=text;f.className='feedback '+(good?'good':'bad');annotate(f)}
function addNextButton(){
 const row=$('nextRow'),next=document.createElement('button');next.className='btn';
 next.textContent=idx===19?'尋找最後寶藏！':(idx%5===4?'前往下一關！':'下一題 →');
 annotate(next);next.onclick=advance;row.replaceChildren(next);
}
function advance(){
 cancelSpeech();idx++;
 if(idx>=20){finish();return}
 if(idx%5===0){showCheckpoint();return}
 renderQuestion();
}
function showCheckpoint(){
 const completed=idx/5,earned=stageStars[completed-1];
 $('checkpointEmoji').textContent=['🎁','🧭','💎','🏆'][completed-1];
 $('checkpointTitle').textContent=completed===4?'四關完成！':'第 '+completed+' 關完成！';
 $('checkpointMsg').textContent='這一關收集到 '+earned+' 顆星星。兔兔正在找下一張藏寶圖！';
 $('checkpointBadges').innerHTML=Array.from({length:5},(_,i)=>'<span class="badge '+(i<earned?'earned':'')+'">'+(i<earned?'⭐':'☆')+'</span>').join('');
 $('continue').textContent=completed===4?'看最後寶藏！':'打開下一關寶箱！';
 annotate($('checkpoint'));show('checkpoint');say(completed===4?'finalCheckpoint':'checkpoint');spark(10);
}
function useHint(){
 if(hints<1||!current)return;
 hints--;const q=current,fromStart=q.side==='左'||q.side==='上',startIndex=fromStart?0:q.count-1;
 const first=$('animal'+startIndex);if(first)first.classList.add('hint-start');
 $('helper').textContent='魔法提示：先從綠色小動物開始數！';
 refreshHintButton();annotate($('helper'));say('hint');
}
function finish(){
 cancelSpeech();$('bar').style.width='100%';$('resultEmoji').textContent=score===20?'🏆':score>=15?'🎉':'🐰';
 $('resultTitle').textContent=score===20?'完美尋寶王！':'尋寶成功！';
 $('resultMsg').textContent=score===20?'兔兔的寶藏都被你找到了！':'你陪兔兔完成了四關大冒險！';
 $('resultScore').textContent='你收集到 '+score+' / 20 顆星星';
 let best=bestScore();if(score>best){best=score;try{localStorage.setItem('bunny-direction-best',String(best))}catch(e){}}
 $('bestLine').textContent='🏆 最高紀錄：'+best+' 顆星';
 $('badges').innerHTML=Array.from({length:20},(_,i)=>'<span class="badge '+(i<score?'earned':'')+'">'+(i<score?'⭐':'☆')+'</span>').join('');
 annotate($('done'));setHomeBest();show('done');spark(score===20?24:12);say('finish');
}
function spark(amount){for(let i=0;i<amount;i++){const s=document.createElement('span');s.className='spark';s.textContent=['✨','⭐','🌼','🥕'][i%4];s.style.left=(8+Math.random()*84)+'vw';s.style.top=(48+Math.random()*38)+'vh';document.body.append(s);setTimeout(()=>s.remove(),750)}}
updateSound();setHomeBest();annotate(document.body);
</script>
